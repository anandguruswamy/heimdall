# Curriculum-transition gate using the preserved full-reduced stage-1 checkpoint.
name: gate-reduced-stage2-transition
dataset_dir: datasets/stage2
epochs: 100000
batch_size: 32
lr: 0.0001
wd: 0.01
warmup_steps: 500
clip: 1.0
seed: 0
log_every: 100
checkpoint_every: 500
device: cuda
eval_every: 500
early_stop_patience: 0
max_steps: 1000
cache_prepared_dataset: true
surfel_pulse_backend: bank-16x
capsule_attenuation_backend: compact
compact_surfel_slots: true
train_render_probability: 0.5
train_render_batch_size: 1
compile_model: true
compile_set_loss: true
model_d_model: 128
model_heads: 4
model_ffn: 512
model_encoder_blocks: 4
model_decoder_blocks: 3
model_queries: 24
