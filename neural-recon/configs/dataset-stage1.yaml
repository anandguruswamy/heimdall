# Stage 1 (Algorithm 1 step 1): 100 noiseless fixed-geometry scenes with
# 1-3 surfels only; no room planes, no nuisance. Overfit/verification set.
stage: 1
scenes: 100
base_seed: 0
node_mode: fixed_live
jitter_m: 0.0
layouts_per_scene: 1
room:
  x_range: [4, 6]
  y_range: [4, 6]
  z_max: [2.4, 3.0]
  partitions: [0, 0]
  planes: false
surfels: {count: [1, 3]}
furniture: {count: [0, 0]}
people: {count: [0, 0]}
hw: {}
