# Run 1, GPU sanity variant: same stage-1 dataset, objective, and batch
# size (8) as train-run1.yaml, plus a wall-clock cap for the Vast.ai
# sanity checks (plan Phase 6 step "monitor and decide").
# epochs is set high; max_minutes is the real stop condition.
# batch_size stays at 8, matching train-run1.yaml. The original quadratic
# scene-conversion bug was fixed, but the scalar renderer still launches one
# scene at a time; measured lookup/compile/cadence options and rejected
# all-formulas batching are recorded in DECISIONS.md (2026-08-05).
name: train-run1-gpu-sanity
dataset_dir: datasets/stage1
epochs: 100000
batch_size: 8
lr: 0.0003
wd: 0.01
warmup_steps: 100
clip: 1.0
seed: 0
log_every: 10
checkpoint_every: 200
balance_every: 0
amp: false
permute_labels: false
device: cuda
eval_every: 50
early_stop_patience: 6
early_stop_min_delta: 0.0001
max_steps: 0
max_minutes: 20
weights:
  set_: 1.0
  cpx: 1.0
  env: 0.5
  fft: 0.1
  reg: 0.01
