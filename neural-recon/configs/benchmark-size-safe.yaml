# Low-risk size ramp: restore the originally proposed 4x FFN and use enough
# model queries for the configured generator's 23-primitive maximum.
name: ab-size-d128-f512-e6-d4-g24
dataset_dir: datasets/stage1
epochs: 100
batch_size: 8
seed: 0
device: cuda
max_steps: 200
warmup_steps: 100
log_every: 100
eval_every: 100
early_stop_patience: 0
checkpoint_every: 1000
surfel_pulse_backend: bank-16x
capsule_attenuation_backend: compact
train_render_probability: 0.5
compile_model: true
compile_set_loss: true
model_d_model: 128
model_heads: 4
model_ffn: 512
model_encoder_blocks: 6
model_decoder_blocks: 4
model_queries: 24
