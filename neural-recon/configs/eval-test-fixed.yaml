# Phase 7 test-fixed set (plan/phase-7-evaluation.md step 3): fixed live
# geometry, in-distribution scene complexity (same recipe as stage 3/4:
# capsules, full hardware randomization, the reverb-tail model). Disjoint
# seed range from every training stage (stage1: 0-99, stage2: 100000+,
# stage3: 200000+, stage4: 300000+) -- base_seed 900000 has never been
# used for training data.
stage: 7
scenes: 500
base_seed: 900000
node_mode: fixed_live
jitter_m: 0.03
layouts_per_scene: 1
room:
  x_range: [3, 8]
  y_range: [3, 8]
  z_max: [2.2, 3.2]
  partitions: [0, 2]
  planes: true
  tilt_deg: [0.0, 3.0]
surfels: {count: [1, 4]}
furniture: {count: [0, 3]}
people: {count: [0, 2], height: [1.5, 1.95], radius: [0.12, 0.22]}
hw:
  gain_db: [0.0, 1.5]
  phase: true
  noise_std: [0.002, 0.6]
  dgc: [3, 6]
  accum: [40, 200]
  cfo_ppm: [0.0, 10.0]
  fp_jitter: 0.15
  peak_offset: [1.69, 0.2]
  resid: 0.05
  missing_link_p: 0.02
  false_fp_p: 0.005
  reverb: [0.3, 1.0]
  reverb_decay_taps: [15.0, 30.0]
