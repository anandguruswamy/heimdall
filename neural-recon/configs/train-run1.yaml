# Run 1 (Algorithm 1 step 1): overfit the stage-1 dataset (100 noiseless
# fixed-geometry scenes, 1-3 surfels). Purpose: verify end-to-end gradient
# flow through UWBRender. CPU-feasible.
name: train-run1
dataset_dir: datasets/stage1
epochs: 60
batch_size: 8
lr: 0.0003
wd: 0.01
warmup_steps: 20
clip: 1.0
seed: 0
log_every: 10
checkpoint_every: 1000
balance_every: 0
amp: false
permute_labels: false
weights:
  set_: 1.0
  cpx: 1.0
  env: 0.5
  fft: 0.1
  reg: 0.01
