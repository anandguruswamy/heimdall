[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nrecon"
version = "0.1.0"
description = "Neural UWB scene reconstruction: differentiable renderer, procedural datasets, and set-prediction network"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "torch==2.13.0",
    "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
include = ["nrecon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
