openapi: 3.1.0
info:
  title: Heimdall UNO Q API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Current service, archive, gateway, node, and link health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /topology:
    get:
      operationId: getTopology
      responses:
        "200":
          description: Current configuration and directed-link topology
  /history/distance:
    get:
      operationId: getDistanceHistory
      responses:
        "200":
          description: Downsampled five-minute SS and DS distance history for reconnect resynchronization
  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Current persisted processing settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    $ref: "#/components/schemas/DspSettings"
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DspSettings"
      responses:
        "200":
          description: New processing epoch
  /board:
    get:
      operationId: getBoardFreezeStatus
      responses:
        "200":
          description: Current board reference freeze status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardFreezeStatus"
  /board/freeze:
    post:
      operationId: freezeBoardReferences
      responses:
        "200":
          description: Board mode frozen with references snapshotted from available link histories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardFreezeStatus"
  /board/unfreeze:
    post:
      operationId: unfreezeBoardReferences
      responses:
        "200":
          description: Board mode unfrozen and all frozen link references cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardFreezeStatus"
  /clips:
    get:
      operationId: listClips
      responses:
        "200":
          description: Protected capture clips
    post:
      operationId: createClip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClip"
      responses:
        "202":
          description: Clip armed and collecting its post-trigger interval
  /clips/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: downloadClip
      responses:
        "200":
          description: Completed protected capture ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
    delete:
      operationId: deleteClip
      responses:
        "204":
          description: Clip deleted
        "404":
          description: Clip not found
  /calibration:
    get:
      operationId: getCalibration
      responses:
        "200":
          description: Live calibration collection and applied solution
  /calibration/snapshot:
    post:
      operationId: startCalibrationSnapshot
      responses:
        "200":
          description: Ten-second DS-TWR snapshot started
  /calibration/solve:
    post:
      operationId: solveCalibration
      responses:
        "200":
          description: Least-squares antenna-delay solution and rank diagnostics
  /calibration/apply:
    post:
      operationId: applyCalibration
      responses:
        "200":
          description: Full-rank calibration solution applied
  /calibration/rollback:
    post:
      operationId: rollbackCalibration
      responses:
        "200":
          description: Previous applied calibration restored
  /stream:
    get:
      operationId: websocketStream
      responses:
        "101":
          description: Versioned FlatBuffers WebSocket stream
components:
  schemas:
    DspSettings:
      type: object
      additionalProperties: true
      properties:
        cir_nuisance_fit:
          type: boolean
          deprecated: true
        cir_fit_algorithm:
          type: string
          enum: [off, linear_ls, robust_grid]
          default: off
        cir_grid_reference_mode:
          type: string
          enum: [frozen, rolling_medoid, rolling_mean]
          default: frozen
        cir_grid_reference_window:
          type: integer
          minimum: 3
          maximum: 64
          default: 32
        cir_grid_score_mode:
          type: string
          enum: [soft, count]
          default: soft
        cir_grid_gain_min_db:
          type: number
          minimum: -40
          maximum: 40
          default: -10
        cir_grid_gain_max_db:
          type: number
          minimum: -40
          maximum: 40
          default: 10
        cir_grid_delay_range_samples:
          type: number
          minimum: 0
          maximum: 8
          default: 2
        cir_grid_resampling_factor:
          type: integer
          enum: [1, 2, 4, 8, 16]
          default: 16
        cir_grid_eta:
          type: number
          exclusiveMinimum: 0
          maximum: 4
          default: 0.25
        cir_grid_reference_peak_db:
          type: number
          minimum: -30
          maximum: 0
          multipleOf: 1
          default: -10
    BoardFreezeStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - board_frozen
        - reference_count
        - configuration_epoch
        - processing_epoch
      properties:
        status:
          type: string
          enum: [current, frozen, unfrozen]
        board_frozen:
          type: boolean
        reference_count:
          type: integer
          minimum: 0
        configuration_epoch:
          type: integer
          format: int64
          minimum: 0
        processing_epoch:
          type: integer
          format: int64
          minimum: 0
    CreateClip:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        note:
          type: string
          maxLength: 2000
    Health:
      type: object
      required:
        - status
        - uptime_seconds
        - pipeline
        - processing_queue_drops
        - websocket_clients
        - archive
        - process
      properties:
        status:
          type: string
          enum: [ok, degraded]
        uptime_seconds:
          type: number
          minimum: 0
        pipeline:
          type: object
          additionalProperties: true
        processing_queue_drops:
          type: integer
          format: int64
          minimum: 0
        websocket_clients:
          type: integer
          minimum: 0
        archive:
          type: object
          required: [closed_bytes, free_bytes, total_bytes, free_percent, paused, errors]
          properties:
            closed_bytes:
              type: integer
              format: int64
              minimum: 0
            free_bytes:
              type: integer
              format: int64
              minimum: 0
            total_bytes:
              type: integer
              format: int64
              minimum: 0
            free_percent:
              type: number
              minimum: 0
              maximum: 100
            paused:
              type: boolean
            errors:
              type: integer
              format: int64
              minimum: 0
            last_error:
              type: [string, "null"]
        process:
          type: object
          required: [rss_bytes]
          properties:
            rss_bytes:
              type: integer
              format: int64
              minimum: 0
