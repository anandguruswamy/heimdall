openapi: 3.1.0
info:
  title: Heimdall UNO Q API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Current service, archive, gateway, node, and link health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /topology:
    get:
      operationId: getTopology
      responses:
        "200":
          description: Current configuration and directed-link topology
  /history/distance:
    get:
      operationId: getDistanceHistory
      responses:
        "200":
          description: Downsampled five-minute SS and DS distance history for reconnect resynchronization
  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Current persisted processing settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    $ref: "#/components/schemas/DspSettings"
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DspSettings"
      responses:
        "200":
          description: New processing epoch
  /board:
    get:
      operationId: getBoardFreezeStatus
      responses:
        "200":
          description: Current board reference freeze status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardFreezeStatus"
  /board/freeze:
    post:
      operationId: freezeBoardReferences
      responses:
        "200":
          description: Board mode frozen with references snapshotted from available link histories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardFreezeStatus"
  /board/unfreeze:
    post:
      operationId: unfreezeBoardReferences
      responses:
        "200":
          description: Board mode unfrozen and all frozen link references cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardFreezeStatus"
  /clips:
    get:
      operationId: listClips
      responses:
        "200":
          description: Protected capture clips
    post:
      operationId: createClip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClip"
      responses:
        "202":
          description: Clip armed and collecting its post-trigger interval
  /clips/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: downloadClip
      responses:
        "200":
          description: Completed protected capture ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
    delete:
      operationId: deleteClip
      responses:
        "204":
          description: Clip deleted
        "404":
          description: Clip not found
  /camera/status:
    get:
      operationId: getCameraStatus
      responses:
        "200":
          description: Continuous camera manager status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraStatus"
  /camera/frame.jpg:
    get:
      operationId: getCameraPreview
      responses:
        "200":
          description: Latest host-timestamped camera preview (not source-frame synchronized)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
  /camera/sessions:
    get:
      operationId: listCameraSessions
      responses:
        "200":
          description: Stored camera session manifests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CameraSession"
    post:
      operationId: startCameraSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCameraSession"
      responses:
        "201":
          description: Continuous camera recording started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraSession"
  /camera/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/CameraSessionId"
    delete:
      operationId: deleteCameraSession
      responses:
        "204":
          description: Inactive camera session deleted
        "404":
          description: Camera session not found
  /camera/sessions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/CameraSessionId"
    post:
      operationId: addCameraSessionEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCameraEvent"
      responses:
        "200":
          description: Event timestamped by the server and persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraSession"
  /camera/sessions/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/CameraSessionId"
    post:
      operationId: stopCameraSession
      responses:
        "200":
          description: FFmpeg stopped gracefully or killed after a bounded timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraSession"
  /camera/sessions/{id}/video:
    parameters:
      - $ref: "#/components/parameters/CameraSessionId"
    get:
      operationId: downloadCameraVideo
      responses:
        "200":
          description: Completed fragmented MP4 recording
          content:
            video/mp4:
              schema:
                type: string
                format: binary
  /calibration:
    get:
      operationId: getCalibration
      responses:
        "200":
          description: Live calibration collection and applied solution
  /calibration/snapshot:
    post:
      operationId: startCalibrationSnapshot
      responses:
        "200":
          description: Ten-second DS-TWR snapshot started
  /calibration/solve:
    post:
      operationId: solveCalibration
      responses:
        "200":
          description: Least-squares antenna-delay solution and rank diagnostics
  /calibration/apply:
    post:
      operationId: applyCalibration
      responses:
        "200":
          description: Full-rank calibration solution applied
  /calibration/rollback:
    post:
      operationId: rollbackCalibration
      responses:
        "200":
          description: Previous applied calibration restored
  /stream:
    get:
      operationId: websocketStream
      responses:
        "101":
          description: Versioned FlatBuffers WebSocket stream
components:
  parameters:
    CameraSessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,80}$"
  schemas:
    SeatClass:
      type: string
      enum: [FrontLeft, FrontRight, BackRight, BackLeft, Empty]
    StartCameraSession:
      type: object
      additionalProperties: false
      required: [person, consent]
      properties:
        person:
          type: string
          minLength: 1
          maxLength: 60
        consent:
          type: boolean
          const: true
    AddCameraEvent:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 60
        seat:
          $ref: "#/components/schemas/SeatClass"
        note:
          type: string
          maxLength: 500
    CameraStatus:
      type: object
      additionalProperties: false
      required: [enabled, device, width, height, fps, state, session, preview_available, error]
      properties:
        enabled:
          type: boolean
        device:
          type: [string, "null"]
        width:
          type: integer
          const: 1280
        height:
          type: integer
          const: 720
        fps:
          type: integer
          const: 30
        state:
          type: string
          enum: [disabled, idle, recording, error]
        session:
          oneOf:
            - $ref: "#/components/schemas/CameraSession"
            - type: "null"
        preview_available:
          type: boolean
        error:
          type: [string, "null"]
    CameraSession:
      type: object
      additionalProperties: false
      required: [id, person, consent, status, started_ns, video_path, preview_path, ffmpeg_log_path, events]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,80}$"
        person:
          type: string
          maxLength: 60
        consent:
          type: boolean
          const: true
        status:
          type: string
          enum: [recording, complete, failed]
        started_ns:
          type: integer
          format: int64
        stopped_ns:
          type: integer
          format: int64
        error:
          type: string
        video_path:
          type: string
          const: video.mp4
        preview_path:
          type: string
          const: preview.jpg
        ffmpeg_log_path:
          type: string
          const: ffmpeg.log
        events:
          type: array
          items:
            $ref: "#/components/schemas/CameraEvent"
    CameraEvent:
      type: object
      additionalProperties: false
      required: [kind, timestamp_ns]
      properties:
        kind:
          type: string
          maxLength: 60
        seat:
          $ref: "#/components/schemas/SeatClass"
        note:
          type: string
          maxLength: 500
        timestamp_ns:
          type: integer
          format: int64
        calibration_path:
          type: string
    DspSettings:
      type: object
      additionalProperties: true
      properties:
        cir_nuisance_fit:
          type: boolean
          deprecated: true
        cir_fit_algorithm:
          type: string
          enum: [off, linear_ls, robust_grid]
          default: off
        cir_grid_reference_mode:
          type: string
          enum: [frozen, rolling_medoid, rolling_mean]
          default: frozen
        cir_grid_reference_window:
          type: integer
          minimum: 3
          maximum: 64
          default: 32
        cir_grid_score_mode:
          type: string
          enum: [soft, count]
          default: soft
        cir_grid_gain_min_db:
          type: number
          minimum: -40
          maximum: 40
          default: -10
        cir_grid_gain_max_db:
          type: number
          minimum: -40
          maximum: 40
          default: 10
        cir_grid_delay_range_samples:
          type: number
          minimum: 0
          maximum: 8
          default: 2
        cir_grid_resampling_factor:
          type: integer
          enum: [1, 2, 4, 8, 16]
          default: 16
        cir_grid_eta:
          type: number
          exclusiveMinimum: 0
          maximum: 4
          default: 0.25
        cir_grid_reference_peak_db:
          type: number
          minimum: -30
          maximum: 0
          multipleOf: 1
          default: -10
    BoardFreezeStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - board_frozen
        - reference_count
        - configuration_epoch
        - processing_epoch
      properties:
        status:
          type: string
          enum: [current, frozen, unfrozen]
        board_frozen:
          type: boolean
        reference_count:
          type: integer
          minimum: 0
        configuration_epoch:
          type: integer
          format: int64
          minimum: 0
        processing_epoch:
          type: integer
          format: int64
          minimum: 0
    CreateClip:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        note:
          type: string
          maxLength: 2000
    Health:
      type: object
      required:
        - status
        - uptime_seconds
        - pipeline
        - processing_queue_drops
        - websocket_clients
        - archive
        - process
        - camera
      properties:
        status:
          type: string
          enum: [ok, degraded]
        uptime_seconds:
          type: number
          minimum: 0
        pipeline:
          type: object
          additionalProperties: true
        processing_queue_drops:
          type: integer
          format: int64
          minimum: 0
        websocket_clients:
          type: integer
          minimum: 0
        archive:
          type: object
          required: [closed_bytes, free_bytes, total_bytes, free_percent, paused, errors]
          properties:
            closed_bytes:
              type: integer
              format: int64
              minimum: 0
            free_bytes:
              type: integer
              format: int64
              minimum: 0
            total_bytes:
              type: integer
              format: int64
              minimum: 0
            free_percent:
              type: number
              minimum: 0
              maximum: 100
            paused:
              type: boolean
            errors:
              type: integer
              format: int64
              minimum: 0
            last_error:
              type: [string, "null"]
        process:
          type: object
          required: [rss_bytes]
          properties:
            rss_bytes:
              type: integer
              format: int64
              minimum: 0
        camera:
          $ref: "#/components/schemas/CameraStatus"
