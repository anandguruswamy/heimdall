[workspace]
resolver = "2"
members = [
    "crates/heimdall-protocol",
    "crates/heimdall-dsp",
    "crates/heimdall-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.11.1"
crc32fast = "1.5.0"
flatbuffers = "25.12.19"
futures-util = "0.3.31"
libc = "0.2.189"
num-complex = { version = "0.4.6", features = ["serde"] }
parking_lot = "0.12.5"
rayon = "1.11.0"
rusqlite = { version = "0.38.0", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
zip = { version = "7.2.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
